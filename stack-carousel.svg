<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 110" width="700" height="110">
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="12%"  style="stop-color:#0d1117;stop-opacity:0"/>
      <stop offset="88%"  style="stop-color:#0d1117;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <mask id="m">
      <rect width="700" height="110" fill="white"/>
      <rect width="700" height="110" fill="url(#fade)"/>
    </mask>
    <style>
      .track { animation: scroll 18s linear infinite; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-700px); } }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
    </style>
  </defs>
  <rect width="700" height="110" fill="#0d1117"/>
  <g mask="url(#m)">
    <g class="track">
      <!-- Set 1 -->
      <g transform="translate(10,10)">
        <image href="https://skillicons.dev/icons?i=react&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">React</text>
      </g>
      <g transform="translate(110,10)">
        <image href="https://skillicons.dev/icons?i=nextjs&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Next.js</text>
      </g>
      <g transform="translate(210,10)">
        <image href="https://skillicons.dev/icons?i=ts&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">TypeScript</text>
      </g>
      <g transform="translate(310,10)">
        <image href="https://skillicons.dev/icons?i=nodejs&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Node.js</text>
      </g>
      <g transform="translate(410,10)">
        <image href="https://skillicons.dev/icons?i=postgres&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">PostgreSQL</text>
      </g>
      <g transform="translate(510,10)">
        <image href="https://skillicons.dev/icons?i=prisma&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Prisma</text>
      </g>
      <g transform="translate(610,10)">
        <image href="https://skillicons.dev/icons?i=docker&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Docker</text>
      </g>
      <!-- Set 2 (seamless loop duplicate) -->
      <g transform="translate(710,10)">
        <image href="https://skillicons.dev/icons?i=react&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">React</text>
      </g>
      <g transform="translate(810,10)">
        <image href="https://skillicons.dev/icons?i=nextjs&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Next.js</text>
      </g>
      <g transform="translate(910,10)">
        <image href="https://skillicons.dev/icons?i=ts&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">TypeScript</text>
      </g>
      <g transform="translate(1010,10)">
        <image href="https://skillicons.dev/icons?i=nodejs&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Node.js</text>
      </g>
      <g transform="translate(1110,10)">
        <image href="https://skillicons.dev/icons?i=postgres&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">PostgreSQL</text>
      </g>
      <g transform="translate(1210,10)">
        <image href="https://skillicons.dev/icons?i=prisma&amp;theme=dark" width="60" height="60"/>
        <text class="lbl" x="30" y="80">Prisma</text>
      </g>
      <g transform="translate(1310,10)">
        <image href="https://skillicons.dev/icons?i=docker&amp;theme=dark" width="60" height="60"/>
