<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 110" width="700" height="110">
  <defs>
    <style>
      .track { animation: scroll 20s linear infinite; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-700px); } }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
    </style>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="12%"  stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <mask id="m">
      <rect width="700" height="110" fill="white"/>
      <rect width="700" height="110" fill="url(#g1)"/>
    </mask>
  </defs>

  <rect width="700" height="110" fill="#0d1117"/>

  <g mask="url(#m)">
    <g class="track">

      <!-- REACT -->
      <g transform="translate(20,15)">
        <rect width="60" height="60" rx="10" fill="#20232a"/>
        <g transform="translate(30,30)" fill="none" stroke="#61DAFB" stroke-width="2.5">
          <ellipse rx="22" ry="7"/>
          <ellipse rx="22" ry="7" transform="rotate(60)"/>
          <ellipse rx="22" ry="7" transform="rotate(120)"/>
        </g>
        <circle cx="30" cy="30" r="3.5" fill="#61DAFB"/>
        <text class="lbl" x="30" y="78">React</text>
      </g>

      <!-- NEXT.JS -->
      <g transform="translate(120,15)">
        <rect width="60" height="60" rx="10" fill="#000"/>
        <text x="30" y="43" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="32" fill="white">N</text>
        <text class="lbl" x="30" y="78">Next.js</text>
      </g>

      <!-- TYPESCRIPT -->
      <g transform="translate(220,15)">
        <rect width="60" height="60" rx="10" fill="#3178C6"/>
        <text x="30" y="42" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="24" fill="white">TS</text>
        <text class="lbl" x="30" y="78">TypeScript</text>
      </g>

      <!-- NODE.JS -->
      <g transform="translate(320,15)">
        <rect width="60" height="60" rx="10" fill="#1a1a1a"/>
        <polygon points="30,6 52,18 52,42 30,54 8,42 8,18" fill="#3C873A"/>
        <text x="30" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="white">Node</text>
        <text x="30" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="white">.js</text>
        <text class="lbl" x="30" y="78">Node.js</text>
      </g>

      <!-- POSTGRESQL -->
      <g transform="translate(420,15)">
        <rect width="60" height="60" rx="10" fill="#336791"/>
        <!-- elephant head -->
        <ellipse cx="28" cy="26" rx="15" ry="16" fill="white" opacity="0.95"/>
        <!-- left ear -->
        <ellipse cx="14" cy="22" rx="5" ry="7" fill="white" opacity="0.75"/>
        <!-- trunk curling right -->
        <path d="M40,28 Q50,26 49,36 Q48,44 42,42" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
        <!-- eyes -->
        <circle cx="23" cy="22" r="2" fill="#336791"/>
        <circle cx="33" cy="22" r="2" fill="#336791"/>
        <!-- tusk -->
        <path d="M22,38 Q18,44 14,44" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
        <text class="lbl" x="30" y="78">PostgreSQL</text>
      </g>

      <!-- PRISMA -->
      <g transform="translate(520,15)">
        <rect width="60" height="60" rx="10" fill="#0C344B"/>
        <polygon points="30,8 52,50 8,50" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
        <line x1="30" y1="8" x2="30" y2="50" stroke="#A78BFA" stroke-width="1.5" opacity="0.55"/>
        <line x1="8" y1="50" x2="30" y2="30" stroke="#A78BFA" stroke-width="1" opacity="0.35"/>
        <text class="lbl" x="30" y="78">Prisma</text>
      </g>

      <!-- DOCKER -->
      <g transform="translate(620,15)">
        <rect width="60" height="60" rx="10" fill="#1d63ed"/>
        <!-- container grid -->
        <g fill="none" stroke="white" stroke-width="1.8">
          <rect x="7"  y="28" width="9" height="8" rx="1"/>
          <rect x="18" y="28" width="9" height="8" rx="1"/>
          <rect x="29" y="28" width="9" height="8" rx="1"/>
          <rect x="7"  y="18" width="9" height="8" rx="1"/>
          <rect x="18" y="18" width="9" height="8" rx="1"/>
          <rect x="18" y="8"  width="9" height="8" rx="1"/>
        </g>
        <!-- whale tail -->
        <path d="M42,30 Q52,22 50,32 Q48,40 43,37" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        <!-- waterline -->
        <path d="M4,42 Q17,39 30,42 Q43,39 56,42" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>
        <text class="lbl" x="30" y="78">Docker</text>
      </g>

      <!-- ===== DUPLICATE SET 2 ===== -->

      <g transform="translate(720,15)">
        <rect width="60" height="60" rx="10" fill="#20232a"/>
        <g transform="translate(30,30)" fill="none" stroke="#61DAFB" stroke-width="2.5">
          <ellipse rx="22" ry="7"/>
          <ellipse rx="22" ry="7" transform="rotate(60)"/>
          <ellipse rx="22" ry="7" transform="rotate(120)"/>
        </g>
        <circle cx="30" cy="30" r="3.5" fill="#61DAFB"/>
        <text class="lbl" x="30" y="78">React</text>
      </g>

      <g transform="translate(820,15)">
        <rect width="60" height="60" rx="10" fill="#000"/>
        <text x="30" y="43" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="32" fill="white">N</text>
        <text class="lbl" x="30" y="78">Next.js</text>
      </g>

      <g transform="translate(920,15)">
        <rect width="60" height="60" rx="10" fill="#3178C6"/>
        <text x="30" y="42" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="24" fill="white">TS</text>
        <text class="lbl" x="30" y="78">TypeScript</text>
      </g>

      <g transform="translate(1020,15)">
        <rect width="60" height="60" rx="10" fill="#1a1a1a"/>
        <polygon points="30,6 52,18 52,42 30,54 8,42 8,18" fill="#3C873A"/>
        <text x="30" y="33" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="white">Node</text>
        <text x="30" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="white">.js</text>
        <text class="lbl" x="30" y="78">Node.js</text>
      </g>

      <g transform="translate(1120,15)">
        <rect width="60" height="60" rx="10" fill="#336791"/>
        <ellipse cx="28" cy="26" rx="15" ry="16" fill="white" opacity="0.95"/>
        <ellipse cx="14" cy="22" rx="5" ry="7" fill="white" opacity="0.75"/>
        <path d="M40,28 Q50,26 49,36 Q48,44 42,42" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
        <circle cx="23" cy="22" r="2" fill="#336791"/>
        <circle cx="33" cy="22" r="2" fill="#336791"/>
        <path d="M22,38 Q18,44 14,44" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
        <text class="lbl" x="30" y="78">PostgreSQL</text>
      </g>

      <g transform="translate(1220,15)">
        <rect width="60" height="60" rx="10" fill="#0C344B"/>
        <polygon points="30,8 52,50 8,50" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
        <line x1="30" y1="8" x2="30" y2="50" stroke="#A78BFA" stroke-width="1.5" opacity="0.55"/>
        <line x1="8" y1="50" x2="30" y2="30" stroke="#A78BFA" stroke-width="1" opacity="0.35"/>
        <text class="lbl" x="30" y="78">Prisma</text>
      </g>

      <g transform="translate(1320,15)">
        <rect width="60" height="60" rx="10" fill="#1d63ed"/>
        <g fill="none" stroke="white" stroke-width="1.8">
          <rect x="7"  y="28" width="9" height="8" rx="1"/>
          <rect x="18" y="28" width="9" height="8" rx="1"/>
          <rect x="29" y="28" width="9" height="8" rx="1"/>
          <rect x="7"  y="18" width="9" height="8" rx="1"/>
          <rect x="18" y="18" width="9" height="8" rx="1"/>
          <rect x="18" y="8"  width="9" height="8" rx="1"/>
        </g>
        <path d="M42,30 Q52,22 50,32 Q48,40 43,37" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M4,42 Q17,39 30,42 Q43,39 56,42" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>
        <text class="lbl" x="30" y="78">Docker</text>
      </g>

    </g>
  </g>
</svg>
